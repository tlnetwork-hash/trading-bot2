services:
  bot:
    build: .
    image: grid-bot
    container_name: grid-bot
    restart: unless-stopped        # restart on crashes and after server reboots
    env_file: .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data           # saved state and log files live here
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Read-only web page showing the bot's progress. It only reads ./data.
  # By default it is reachable only from the server itself. To open it from
  # your devices over Tailscale, set DASHBOARD_BIND to the server's Tailscale
  # IP in .env (see README "Dashboard").
  dashboard:
    image: grid-bot
    container_name: grid-bot-dashboard
    command: ["python", "-m", "bot", "dashboard"]
    restart: unless-stopped
    depends_on: [bot]
    env_file: .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data:ro
    ports:
      - "${DASHBOARD_BIND:-127.0.0.1}:8080:8080"
    logging: *logging

  # Second bot: same strategy on Binance.US, with its own settings
  # (config-binanceus.yaml), its own data folder, and its own dashboard on
  # port 8081. Its commands use its service name, e.g.
  #   docker compose exec bot-binanceus python -m bot status
  bot-binanceus:
    image: grid-bot
    container_name: grid-bot-binanceus
    restart: unless-stopped
    depends_on: [bot]              # bot builds the shared image
    env_file: .env
    environment:
      BOT_SERVICE: bot-binanceus   # shown in alerts' help text
    volumes:
      - ./config-binanceus.yaml:/app/config.yaml:ro
      - ./data-binanceus:/app/data
    logging: *logging

  dashboard-binanceus:
    image: grid-bot
    container_name: grid-bot-binanceus-dashboard
    command: ["python", "-m", "bot", "dashboard"]
    restart: unless-stopped
    depends_on: [bot-binanceus]
    env_file: .env
    environment:
      BOT_SERVICE: bot-binanceus   # shown in the dashboard's help text
    volumes:
      - ./config-binanceus.yaml:/app/config.yaml:ro
      - ./data-binanceus:/app/data:ro
    ports:
      - "${DASHBOARD_BIND:-127.0.0.1}:8081:8080"
    logging: *logging

  # Third bot: standalone SOL grid on Binance.US (paper), with its own
  # settings (config-solgrid.yaml), data folder, and dashboard on port 8082.
  #   docker compose exec bot-solgrid python -m bot status
  bot-solgrid:
    image: grid-bot
    container_name: grid-bot-solgrid
    restart: unless-stopped
    env_file: .env
    environment:
      BOT_SERVICE: bot-solgrid
    volumes:
      - ./config-solgrid.yaml:/app/config.yaml:ro
      - ./data-solgrid:/app/data
    logging: *logging

  dashboard-solgrid:
    image: grid-bot
    container_name: grid-bot-solgrid-dashboard
    command: ["python", "-m", "bot", "dashboard"]
    restart: unless-stopped
    depends_on: [bot-solgrid]
    env_file: .env
    environment:
      BOT_SERVICE: bot-solgrid
    volumes:
      - ./config-solgrid.yaml:/app/config.yaml:ro
      - ./data-solgrid:/app/data:ro
    ports:
      - "${DASHBOARD_BIND:-127.0.0.1}:8082:8080"
    logging: *logging

  # Fourth bot: LIVE $50 SOL grid on Binance.US (real money), settings in
  # config-sollive.yaml, data in data-sollive, dashboard on port 8083.
  # It has its OWN private phone-command topic so commands meant for the paper
  # bots can never reach it. Commands:
  #   docker compose exec bot-sollive python -m bot status
  #   docker compose exec bot-sollive python -m bot sell all
  # Built as its own image (grid-bot-live) so the other bots are unaffected.
  bot-sollive:
    build: .
    image: grid-bot-live
    container_name: grid-bot-sollive
    restart: unless-stopped
    env_file:
      - .env
      # The Binance.US key lives here so it can be added from the ubuntu login.
      - path: /home/ubuntu/binance-us-keys.env
        required: false
    environment:
      BOT_SERVICE: bot-sollive
      NTFY_COMMAND_TOPIC: ${NTFY_SOLLIVE_COMMAND_TOPIC:-}
      NTFY_COMMANDS_PRIMARY: "1"
    volumes:
      - ./config-sollive.yaml:/app/config.yaml:ro
      - ./data-sollive:/app/data
    logging: *logging

  dashboard-sollive:
    image: grid-bot-live
    container_name: grid-bot-sollive-dashboard
    command: ["python", "-m", "bot", "dashboard"]
    restart: unless-stopped
    depends_on: [bot-sollive]
    env_file:
      - .env
      # The Binance.US key lives here so it can be added from the ubuntu login.
      - path: /home/ubuntu/binance-us-keys.env
        required: false
    environment:
      BOT_SERVICE: bot-sollive
      NTFY_COMMAND_TOPIC: ${NTFY_SOLLIVE_COMMAND_TOPIC:-}
      NTFY_COMMANDS_PRIMARY: "1"
    volumes:
      - ./config-sollive.yaml:/app/config.yaml:ro
      - ./data-sollive:/app/data:ro
    ports:
      - "${DASHBOARD_BIND:-127.0.0.1}:8083:8080"
    logging: *logging

  # Optional: lets you open the dashboards from any computer's browser behind a
  # Cloudflare Access login (README "Viewing from any computer"). Off unless
  # .env has COMPOSE_PROFILES=cloudflare and CLOUDFLARE_TUNNEL_TOKEN. It
  # connects out to Cloudflare, so no ports are opened on the server.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: grid-bot-cloudflared
    profiles: [cloudflare]
    command: ["tunnel", "--no-autoupdate", "run"]
    restart: unless-stopped
    depends_on: [dashboard, dashboard-binanceus]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    logging: *logging
