# Grid bot settings. After editing, restart the bot:  docker compose restart
#
# Changes to the "grid" section only take effect the next time the grid is
# built (first start, "resume", or "reset").

# paper = simulated trades on real Kraken prices (no money at risk)
# live  = real orders on your Kraken account
mode: paper

# Which exchange: kraken or binanceus. The Binance.US bot has its own file,
# config-binanceus.yaml.
exchange: kraken

symbol: SOL/USD

# How many US dollars the bot is allowed to use. It never touches more than
# this, even if your Kraken account holds more.
capital_usd: 400

grid:
  timeframe: 1h          # candle size used to measure volatility
  atr_period: 14         # number of candles in the volatility average (ATR)
  atr_multiplier: 6      # grid reaches this many ATRs above and below the price
  min_range_pct: 5       # ...but always at least +/-5%
  max_range_pct: 20      # ...and never more than +/-20%
  min_spacing_pct: 1.0   # minimum gap between grid lines; must beat 2x maker fee
  max_levels: 20         # maximum number of grid lines
  fee_reserve_pct: 2     # % of capital kept aside for fees and rounding

# Your Kraken fee tier. Used to simulate paper trades and to check that the
# grid spacing is profitable. 0.40 / 0.80 is Kraken Pro's starting tier
# (Tier 1, since July 2026). Check https://www.kraken.com/features/fee-schedule
fees:
  maker_pct: 0.40
  taker_pct: 0.80

risk:
  # Kill switch: if the bot's money falls this % below where it started,
  # cancel all orders, stop trading, and email you.
  max_drawdown_pct: 10
  # What to do when the price leaves the grid range:
  #   pause    = cancel orders, stop, and email you (you then run "resume")
  #   recenter = automatically rebuild the grid around the new price
  breakout_action: pause
  # Sell SOL right away if the price falls out of the bottom of the grid,
  # instead of holding it while it keeps dropping.
  sell_on_breakout_down: true
  # Profit lock (a trailing stop on the bot's money). Once the bot is up
  # profit_lock_start_pct, it remembers its best gain. If it gives back so
  # much that only profit_lock_keep_pct of that gain is left, it sells all its
  # SOL and pauses. Example: up 4% at best -> sells if it drops back to +2%.
  # The stop only moves up and always stays above where it started.
  # Set profit_lock_start_pct to 0 to turn this off.
  profit_lock_start_pct: 2.0
  profit_lock_keep_pct: 50
  # After a stop-loss or profit-lock sale, start trading again by itself, but
  # only at a good spot to buy: SOL has bounced restart_bounce_pct off its
  # lowest price since the sale (it stopped falling), the price is no higher
  # than where the bot sold, and at least restart_wait_minutes have passed.
  # The kill switch never restarts by itself.
  auto_restart: true
  restart_bounce_pct: 2.0
  restart_wait_minutes: 60

loop:
  poll_seconds: 30       # how often to check prices and orders

alerts:
  email_on_every_fill: true
  daily_summary_hour_utc: 13      # 13:00 UTC = 9am New York (summer time)
  error_email_cooldown_minutes: 30

paper:
  slippage_pct: 0.05     # extra price penalty on simulated market orders

# Buttons at the top of the dashboard for switching between the bots'
# dashboards. Over Tailscale each one is the same server address on a
# different port. If you view them through Cloudflare (README "Viewing from
# any computer"), add each one's https address as url, e.g.
#   - {label: Kraken, port: 8080, url: "https://kraken.example.com/"}
dashboard:
  links:
    - {label: Kraken, port: 8080}
    - {label: Binance.US, port: 8081}
