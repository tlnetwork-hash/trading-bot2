# LIVE $50 SOL grid on Binance.US. Same strategy and settings as the paper
# SOL grid (config-solgrid.yaml) so the two can be compared side by side,
# but with real money. Created 2026-10-21.
# Own data folder (data-sollive), own dashboard on port 8083, and its own
# private phone-command topic (set in docker-compose.yml).
# After editing:  docker compose up -d bot-sollive dashboard-sollive

# HARD LIMITS on how much can be lost:
#  1. The Binance.US account only holds what you deposit (plan: $50), and this
#     is spot trading only: no margin, no futures, no borrowing. The bot can
#     never lose more than what is in the account.
#  2. capital_usd: the bot never uses more than this, even if the account
#     holds more.
#  3. Kill switch (risk.max_drawdown_pct): if the bot's money falls 10% below
#     where it started ($50 -> $45), it cancels every order, SELLS ITS SOL to
#     cash, stops for good, and sends an urgent phone alert. It never restarts
#     by itself; you send "resume" when you're ready.
#  4. The API key must have withdrawals OFF and be locked to this server's IP.
mode: live

# Oct 29 2026 (Todd): LIVE bot switched to the Bollinger Bands mode (bot/bollinger.py),
# same rules as the paper SOL bot. Real market orders on Binance.US.
# Kept: $50 capital, kill switch at $45 (max_drawdown_pct 10) that sells to cash and stops.
# Not used in this mode: the grid, profit lock, $97 buy floor / $100.55 ceiling, breakout pauses.
# Undo: restore config-sollive.yaml.pre-bollinger and data-sollive/state-live.json.pre-bollinger,
# then: docker compose build bot-sollive && docker compose up -d --no-deps bot-sollive dashboard-sollive
strategy: bollinger

bollinger:
  timeframe: 30m      # Oct 29: switched from 1h at Todd's request (undo: config-sollive.yaml.pre-30m)
  period: 20
  std_dev: 2
  min_profit_pct: 1.0
  buy_size_pct: 15       # full buy = $7.50, half = $3.75 (Binance.US minimum is about $1)
  max_coin_pct: 60       # never more than $30-ish in SOL; at least 40% stays cash
  step_down_pct: 0.5
  trend_timeframe: 4h
  trend_period: 50
  trend_slope_candles: 6
  trend_flat_pct: 0.1
  downtrend_size: 0.5
  squeeze_percentile: 20
  squeeze_lookback: 120
  squeeze_size: 0.5
  pullback_buys: true   # Oct 30 (Todd): also buy dips to the middle band while above it (undo: config-sollive.yaml.pre-pullback)

exchange: binanceus
symbol: SOL/USD
capital_usd: 50

grid:
  timeframe: 1h
  atr_period: 14
  atr_multiplier: 6
  min_range_pct: 4
  max_range_pct: 20
  min_spacing_pct: 0.5
  max_levels: 20         # same as the paper bot; ~$2.40 per order, above the $1 minimum
  fee_reserve_pct: 2
  range_below_pct: 4.0       # Oct 28: reaches down to ~$97 so it can buy in the $97-$100 zone
  range_above_pct: 3.0
  keep_coins_on_build: true   # Oct 28: rebuild keeps held SOL for the sells, no market sale or lump buy
  pair_steps: 2               # Oct 28: after a sell, next buy is 2 steps lower
  sell_steps: 2               # Oct 29: each buy's sell is 2 steps (~1%) higher

# Binance.US: 0% maker / 0.02% taker on all spot pairs (since April 2026).
fees:
  maker_pct: 0.0
  taker_pct: 0.02

risk:
  max_drawdown_pct: 10
  kill_switch_sells: true
  breakout_action: pause
  sell_on_breakout_down: false
  profit_lock_start_pct: 2.0
  profit_lock_keep_pct: 50
  profit_lock_min_base_usd: 50   # lock measures from at least $50: arms at $51, never sells below $50.50
  auto_restart: true
  restart_bounce_pct: 2.0
  restart_wait_minutes: 60
  no_buy_below_usd: 97.00           # Oct 28: buy zone $97-$100 only (sells unaffected); 0 = off
  no_buy_above_usd: 100.55          # Oct 29: buys allowed up to $100.55; 0 = off
  recenter_above_after_minutes: 60   # broke above the grid: rebuild by itself after 1 hour above (or at once if it drops back)
  resume_at_break_even: true   # if paused below the grid, restart by itself once back to $50

loop:
  poll_seconds: 30

alerts:
  email_on_every_fill: false      # Oct 28: Todd turned off per-trade alerts; daily summary only
  daily_summary_hour_utc: 13
  error_email_cooldown_minutes: 30

dashboard:
  chart_exchange: kraken
  links: []

